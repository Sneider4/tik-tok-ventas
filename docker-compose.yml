services:
  postgres:
    image: postgres:17-alpine
    container_name: live-oms-postgres
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: live_oms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d live_oms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
